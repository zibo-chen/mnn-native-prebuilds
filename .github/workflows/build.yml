name: Build MNN packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target from configs/mnn.json, all, or backends
        type: string
        default: all
        required: true
      publish:
        description: Publish a new release after the complete matrix passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mnn-build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source lock and target selection
        id: plan
        env:
          BUILD_TARGET: ${{ inputs.target }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true && "$BUILD_TARGET" != all ]]; then
            echo 'Publishing requires all targets.' >&2
            exit 1
          fi
          python -m unittest discover -s tests -v
          python recipes/mnn/build.py plan --target "$BUILD_TARGET"

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.cuda && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - name: Install Linux ARM64 cross compiler
        if: matrix.os == 'linux' && contains(matrix.archs, 'aarch64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install pinned CUDA toolkit (Linux)
        if: matrix.cuda && matrix.os == 'linux'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.cuda.version }}
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cccl", "cuobjdump"]'
          non-cuda-sub-packages: '["libcublas-dev"]'
          log-file-suffix: ${{ matrix.target }}
      - name: Install pinned CUDA toolkit (Windows)
        if: matrix.cuda && matrix.os == 'windows'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.cuda.version }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cuobjdump", "thrust"]'
          log-file-suffix: ${{ matrix.target }}
      - name: Install software Vulkan device for backend inference tests
        if: contains(matrix.software_backend_tests, 'vulkan')
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if [[ -f "$icd" ]]; then
              echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Mesa software Vulkan ICD not found.' >&2
          exit 1
      - name: Install pinned Android NDK
        if: matrix.os == 'android'
        env:
          NDK_VERSION: ${{ matrix.ndk_version }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Fetch exact upstream source and apply compatibility patches
        run: python recipes/mnn/build.py prepare
      - name: Build libraries and verify consumer packages
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python recipes/mnn/build.py build --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: mnn-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mnn-*
          path: dist
          merge-multiple: true
      - name: Verify release completeness and publish if requested
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ inputs.target }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--target "$BUILD_TARGET")
          if [[ "$PUBLISH" == true ]]; then
            args+=(--publish)
          fi
          python scripts/release.py "${args[@]}"
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-index
          path: |
            dist/index.json
            dist/SHA256SUMS
            dist/release-notes.md
